<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Machinal scenes quickstart</title>
  </head>
  <body>
    <main>
      <h1>@machinal/scenes</h1>
      <div id="scene"></div>
      <p>
        <button id="play" type="button" disabled>Play</button>
        <label>Frame <input id="frame" type="range" min="0" max="179" value="0" disabled /></label>
        <output id="status" role="status">Preparing scene...</output>
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
